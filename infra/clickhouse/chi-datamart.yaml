# Instância ClickHouse da POC (1 shard / 1 réplica).
# Só o usuário de bootstrap vive aqui: identidade de tenant declarada no CR não pode
# receber GRANT (o storage users.xml é read-only para SQL). Ver docs/decisoes/ADR-003.
apiVersion: v1
kind: Secret
metadata:
  name: ch-creds
  namespace: datamart
type: Opaque
stringData:
  dm_admin: dm_admin_poc
  acme_ro: acme_ro_poc
  acme_loader: acme_loader_poc
  globex_ro: globex_ro_poc
  globex_loader: globex_loader_poc
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: datamart
  namespace: datamart
spec:
  defaults:
    templates:
      dataVolumeClaimTemplate: data-volume
      # Sem esta linha o operador ignora podTemplates inteiro: sobe `latest` sem
      # limite de memória nenhum, e não avisa.
      podTemplate: default
  configuration:
    files:
      # Os system logs do proprio ClickHouse consomem o orcamento de memoria: em 4h de
      # ociosidade o asynchronous_metric_log juntou 7,9 milhoes de linhas, e o merge dele
      # pediu 872 MiB contra o teto de 1,5 GiB — OOMKill do servidor, sem query nenhuma.
      # query_log fica intacto: o E3 correlaciona query_id nele, e o TTL default do
      # proprio ClickHouse ja o limita. O resto sai.
      config.d/system_logs.xml: |
        <clickhouse>
          <asynchronous_metric_log remove="1"/>
          <metric_log remove="1"/>
          <trace_log remove="1"/>
          <text_log remove="1"/>
          <error_log remove="1"/>
          <processors_profile_log remove="1"/>
        </clickhouse>
    clusters:
      - name: datamart
        layout:
          shardsCount: 1
          replicasCount: 1
    users:
      dm_admin/k8s_secret_password: datamart/ch-creds/dm_admin
      dm_admin/access_management: 1
      dm_admin/networks/ip:
        - "::/0"
      dm_admin/profile: default
      dm_admin/quota: default
    profiles:
      default/optimize_on_insert: 0
    settings:
      # O default do mark_cache é 5 GiB e o de max_server_memory_usage é 90% da RAM
      # vista pelo processo: qualquer um dos dois estoura sozinho o limite do container.
      max_server_memory_usage: 2147483648
      mark_cache_size: 402653184
      # O produto dos dois é validado na subida contra
      # number_of_free_entries_in_pool_to_execute_optimize_entire_partition (25):
      # abaixo disso o servidor recusa iniciar com Code 36 (BAD_ARGUMENTS).
      background_pool_size: 8
      background_merges_mutations_concurrency_ratio: 4
      merge_tree/parts_to_delay_insert: 1000
      merge_tree/parts_to_throw_insert: 3000
      # Um merge precisa de espaço livre igual ao seu resultado; o default (150 GiB)
      # não cabe num PVC de 20Gi e vira Code 243 (NOT_ENOUGH_SPACE) no meio da carga.
      merge_tree/max_bytes_to_merge_at_max_space_in_pool: 10737418240
      merge_tree/min_bytes_for_wide_part: 10485760
  templates:
    volumeClaimTemplates:
      - name: data-volume
        spec:
          accessModes:
            - ReadWriteOnce
          storageClassName: standard
          resources:
            requests:
              storage: 20Gi
    podTemplates:
      - name: default
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:24.8
              resources:
                requests:
                  cpu: "500m"
                  memory: "1Gi"
                limits:
                  cpu: "3"
                  memory: "3Gi"
