# ServiceAccount + RBAC para o driver Spark criar/gerenciar os pods de executor.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: datamart
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: datamart
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  # deletecollection é exigido na finalização do driver: ele limpa services e PVCs
  # por labelSelector. Sem isso o job conclui, mas com Forbidden no log e recursos órfãos.
  - apiGroups: [""]
    resources: ["services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: datamart
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: datamart
roleRef:
  kind: Role
  name: spark-role
  apiGroup: rbac.authorization.k8s.io
