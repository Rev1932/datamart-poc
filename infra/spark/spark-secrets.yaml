# Credenciais consumidas pelo código Spark via variáveis de ambiente.
#
# O prefixo é DATAMART_CH_, não CLICKHOUSE_: o honeycomb já usa CLICKHOUSE_URL,
# CLICKHOUSE_USERNAME e CLICKHOUSE_PASSWORD no _ENV_SCHEMA, e elas pertencem ao
# handler_logger de auditoria, que em produção aponta para api-logs.datawake.cloud.
# Reaproveitá-las faria o log de auditoria escrever no datamart. Ver ARQUITETURA §4 (D2).
#
# DATAMART_CH_DATABASE é por tenant, análogo exato de POSTGRES_DATABASE — é o que
# faz a substituição `spark-TENANT-config` da DAG funcionar sem alteração.
apiVersion: v1
kind: Secret
metadata:
  name: spark-secrets
  namespace: datamart
type: Opaque
stringData:
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"

  DATAMART_CH_URL: "http://clickhouse-datamart.datamart.svc.cluster.local:8123"
  DATAMART_CH_CATALOG: "clickhouse"
  DATAMART_CH_USER: "u_acme_loader"
  DATAMART_CH_PASSWORD: "acme_loader_poc"
  DATAMART_CH_DATABASE: "dm_acme"

  POSTGRES_HOST: "postgres.datamart.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "dm_app"
  POSTGRES_PASSWORD: "dm_app_poc"
  POSTGRES_DATABASE: "dm_acme"
