# Credenciais da PLATAFORMA, iguais para todos os tenants. O que é por tenant vive em
# infra/spark/spark-tenant-config.yaml (spark-<tenant>-config e spark-<tenant>-secret).
#
# AWS_*: o provider declarado no spark-defaults.conf da imagem é o
# EnvironmentVariableCredentialsProvider, que lê exatamente esses dois nomes. MINIO_* ficam
# porque o utils/minio_admin.py do honeycomb usa o cliente próprio, não o S3A.
apiVersion: v1
kind: Secret
metadata:
  name: spark-secrets
  namespace: datamart
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "minioadmin123"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
