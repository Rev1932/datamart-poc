# Credenciais consumidas pelo código Spark via variáveis de ambiente:
#   MINIO_ACCESS_KEY / MINIO_SECRET_KEY  -> resources/application-local.conf (spark.s3)
#   CLICKHOUSE_PASSWORD                  -> catálogo clickhouse
# Devem casar com infra/minio (minioadmin/minioadmin123) e com o usuário do CHI.
apiVersion: v1
kind: Secret
metadata:
  name: spark-secrets
  namespace: datamart
type: Opaque
stringData:
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "minioadmin123"
  CLICKHOUSE_PASSWORD: "datamart123"
