# LEGADO DA V1 — NAO USAR. Aponta para a imagem `datamart-spark:poc`, que a V2
# substituiu por `honeycomb:poc`, e passa argumentos do fork antigo em
# spark-source-code/. Superado pelas DAGs de E2/T2.6. Mantido so como referencia
# do que a V1 submetia; sera removido quando T2.6 entregar os manifestos novos.
# Job C — datamart: reusa a leitura da gold (query sobre a silver + hk_business_id +
# load_dts) e grava o DataFrame no ClickHouse (append). Este é o job medido no
# benchmark de merge. Requer a tabela ClickHouse pré-criada (ddl/01).
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: datamart-fact-200-cep
  namespace: datamart
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: datamart-spark:poc
  imagePullPolicy: IfNotPresent
  mainApplicationFile: local:///opt/spark/app/main.py
  sparkVersion: "3.5.1"
  arguments:
    - "--pipeline"
    - "datamart"
    - "--config-name"
    - "unipac"
    - "--table-name"
    - "fact_200_cep"
    - "--chave-pk"
    - "andon_peso_id"
  restartPolicy:
    type: Never
  # Jars (Delta / hadoop-aws / connector ClickHouse) já vêm assados na imagem em
  # /opt/spark/jars (ver images/spark/Dockerfile) — sem resolução ivy em runtime.
  driver:
    cores: 1
    memory: "1g"
    memoryOverhead: "384m"
    serviceAccount: spark
    env:
      - name: ENV
        value: "local"
    envFrom:
      - secretRef:
          name: spark-secrets
  executor:
    cores: 1
    instances: 1
    memory: "1g"
    memoryOverhead: "384m"
    env:
      - name: ENV
        value: "local"
    envFrom:
      - secretRef:
          name: spark-secrets
