# Secret (EXEMPLO) — valores SECRETOS consumidos pelo ConfigManager e pelo S3A do Spark.
#
# ⚠️ NÃO versione segredos reais. Este arquivo é só o contrato/estrutura. Em produção,
# materialize o Secret via External Secrets Operator + OpenBao (o backend já usado pela
# equipe — ver referência a OpenBao nos testes), ou aplique um Secret gerado fora do git.
#
# ⚠️ AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY NÃO ficam aqui: são as credenciais S3A do Spark
# (EnvironmentVariableCredentialsProvider, ver session.py) e vêm do secret `spark-secrets` da
# plataforma, já existente em dw-dados. São DISTINTAS de SPARK_S3_ACCESS_KEY/SECRET_KEY abaixo
# (essas alimentam só o cliente minio-py do pipeline bronze_silver).
apiVersion: v1
kind: Secret
metadata:
  name: spark-unipac-secret
  namespace: dw-dados
  labels:
    app.kubernetes.io/name: spark-unipac
type: Opaque
stringData:
  # --- Postgres --- (só gold_datamart; o pipeline `gold` NÃO consome)
  POSTGRES_USER: "etl_admin"
  POSTGRES_PASSWORD: "unipac_dw"

  # --- Cliente minio-py --- (só bronze_silver, repo/repository.py:211; `gold` NÃO consome)
  SPARK_S3_ACCESS_KEY: "masteradmin"
  SPARK_S3_SECRET_KEY: "uP9#vL2@kR5*zN8@mQ1$"

  AWS_ACCESS_KEY_ID: "masteradmin"
  AWS_SECRET_ACCESS_KEY: "uP9#vL2@kR5*zN8@mQ1$"

  # --- Trino (basic ou oauth2, conforme TRINO_TYPE_AUTH) ---
  # OBRIGATÓRIO no pipeline `gold`: é a credencial do CALL register_table
  # (utils/trino_connection.py). Precisa ser um principal de app do Trino com
  # permissão no schema alvo — `admin` abaixo é só placeholder.
  TRINO_USER: "admin"
  TRINO_PASSWORD: "pasteldeflango"
  # TRINO_CLIENT_ID: "REPLACE_ME"
  # TRINO_CLIENT_SECRET: "REPLACE_ME"

  # --- ClickHouse ---
  CLICKHOUSE_USERNAME: "unipac"
  CLICKHOUSE_PASSWORD: "hbT3IyxlZgMSqcj"
  # A cadeia de CA do ClickHouse NÃO fica aqui: é compartilhada por N pipelines e vive num
  # Secret próprio e agnóstico de tenant (`dtlk-clickhouse-ca`, ver
  # k8s/clickhouse-ca-secret.example.yaml), montado como arquivo pelo sparkapplication.yaml.
