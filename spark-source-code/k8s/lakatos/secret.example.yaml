# Secret (EXEMPLO) — valores SECRETOS do super tenant Lakatos.
#
# ⚠️ NÃO versione segredos reais. Este arquivo é só o contrato/estrutura. Em produção,
# materialize o Secret via External Secrets Operator + OpenBao, ou aplique um Secret gerado
# fora do git.
#
# ⚠️ AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY são as credenciais S3A do Spark
# (EnvironmentVariableCredentialsProvider, ver src/main/utils/session.py) e normalmente vêm do
# secret `spark-secrets` da plataforma. AQUI ELAS PODEM PRECISAR SER SOBRESCRITAS: este é o único
# pipeline que lê buckets de OUTROS tenants, e a opção recomendada é um usuário S3 dedicado com
# leitura restrita aos buckets dos clientes do Lakatos, em vez de ampliar a policy do usuário
# compartilhado `dw-app-spark-k8s`. Se optar por isso, declare as chaves abaixo e garanta que
# este secretRef venha DEPOIS de `spark-secrets` no `envFrom` (o último vence).
apiVersion: v1
kind: Secret
metadata:
  name: spark-lakatos-secret
  namespace: dw-dados
  labels:
    app.kubernetes.io/name: spark-lakatos
type: Opaque
stringData:
  # --- Postgres --- (só gold_datamart; silver_super_tenant NÃO consome)
  POSTGRES_USER: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"

  # --- Credenciais S3A dedicadas (OPCIONAL — ver o aviso no cabeçalho) ---
  # Precisam de: LEITURA em cada bucket de cliente do Lakatos + RW em datawake-lakatos.
  # AWS_ACCESS_KEY_ID: "REPLACE_ME"
  # AWS_SECRET_ACCESS_KEY: "REPLACE_ME"

  # --- Cliente minio-py ---
  # NÃO consumido pelo silver_super_tenant: ele não lista nem move arquivo de origem (o
  # RepositorySilverSuperTenant nem instancia o MinioAdmin, de propósito — os parquets de origem
  # pertencem ao cliente). Declare só se o Lakatos também rodar `bronze_silver` de dados próprios.
  # SPARK_S3_ACCESS_KEY: "REPLACE_ME"
  # SPARK_S3_SECRET_KEY: "REPLACE_ME"

  # --- Trino ---
  # OBRIGATÓRIO: é a credencial do CALL register_table (utils/trino_connection.py), executado ao
  # fim de toda consolidação. Precisa de permissão no schema `business_lakatos`.
  TRINO_USER: "REPLACE_ME"
  TRINO_PASSWORD: "REPLACE_ME"

  # --- ClickHouse ---
  CLICKHOUSE_USERNAME: "REPLACE_ME"
  CLICKHOUSE_PASSWORD: "REPLACE_ME"
  # A cadeia de CA NÃO fica aqui: vive no Secret agnóstico de tenant `dtlk-clickhouse-ca`
  # (k8s/clickhouse-ca-secret.example.yaml), montado como arquivo pelo sparkapplication.
