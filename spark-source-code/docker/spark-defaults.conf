# Defaults embutidos na imagem: todo submit ja nasce com MinIO + Delta + Hive Metastore.
# Credenciais S3 NUNCA aqui — vem de AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY (secret spark-secrets).
#
# ATENCAO: sob o Spark Operator do namespace dw-dados este arquivo e SOMBREADO. O operator roda
# com o feature gate LoadSparkDefaults e injeta o ConfigMap `spark-operator-defaults` em toda
# submissao; o conf da imagem perde para o configmap de conf que o spark-submit monta no driver.
# Consequencia pratica:
#   - config especifica DESTE job vai no `sparkConf` do k8s/sparkapplication.yaml, nao aqui;
#   - este arquivo vale para execucao local/standalone e como fonte unica caso o job rode em
#     outro cluster (sem operator).

# Delta Lake
spark.sql.extensions                          io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog               org.apache.spark.sql.delta.catalog.DeltaCatalog

# Hive Metastore (interno k8s — mesmo URI usado pelo Trino)
spark.sql.catalogImplementation               hive
spark.hadoop.hive.metastore.uris              thrift://dtlk-mysql-hive-metastore-0.dtlk-mysql-hive-metastore.dtlk-hive.svc.local-k8s.datawake.cloud:9083
spark.sql.warehouse.dir                       s3a://hive-warehouse/default
# Servidor e Hive 4.2: o cliente builtin 2.3.9 usa thrift removido no Hive 4.
# Cliente 3.1.3 (jars embutidos na imagem — ver Dockerfile) fala get_table_req.
spark.sql.hive.metastore.version              3.1.3
spark.sql.hive.metastore.jars                 path
spark.sql.hive.metastore.jars.path            /opt/hive-metastore-jars/*

# MinIO via endpoint externo (TLS GoDaddy CA publica; mesma config do Trino)
spark.hadoop.fs.s3a.endpoint                  https://minio.datawake.cloud:9000
spark.hadoop.fs.s3a.path.style.access         true
spark.hadoop.fs.s3a.connection.ssl.enabled    true
spark.hadoop.fs.s3a.impl                      org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.aws.credentials.provider  com.amazonaws.auth.EnvironmentVariableCredentialsProvider
