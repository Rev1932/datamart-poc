[pytest]
# Sem este arquivo o pytest sobe a arvore procurando configuracao, nao acha nenhuma no
# repositorio e para em /pyproject.toml — uma copia vazada de bind mount de container na
# raiz do host. Como aquele arquivo declara pythonpath = ["src/main"] e o rootdir vira "/",
# os imports resolviam para /src/main (codigo obsoleto) em vez do codigo deste repositorio.
# Ancorar o rootdir aqui e o que mantem a suite testando o que esta versionado.
testpaths = tests
pythonpath = src/main
addopts = -m "not integration"
markers =
    integration: exige Docker e SparkSession local; rode com: pytest -m integration
